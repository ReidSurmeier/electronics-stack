[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "electronics-stack"
version = "0.1.0"
description = "Local, evidence-oriented KiCad verification and design-draft tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6,<7",
  "rapidfuzz>=3,<4",
  "requests>=2.31,<3",
  "sexpdata>=1.0,<2",
]

[project.optional-dependencies]
design = [
  "skidl>=2.2,<3",
]
test = [
  "pytest>=8,<9",
  "reportlab>=4,<5",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
